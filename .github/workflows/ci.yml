name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt nbconvert ipykernel
      - name: Unit tests
        run: python -m pytest -q
      - name: Notebook smoke run (demo data)
        env:
          PITCHSCOUT_DEMO: "1"
          MPLBACKEND: Agg
        run: |
          mkdir -p "$RUNNER_TEMP/nb"
          for nb in notebooks/*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute "$nb" \
              --output-dir "$RUNNER_TEMP/nb" --ExecutePreprocessor.timeout=600
            echo "::endgroup::"
          done
